name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # the release workflow runs CI on its lockfile PR branch

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - name: Console script runs
        run: server-motd

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ansible-lint
      - run: ansible-lint

  debian-hook:
    name: role and hook render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build ansible-core
      - run: python -m build --wheel
      - name: Apply the role to the runner
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_STDOUT_CALLBACK: default
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          ansible-playbook -i localhost, -c local -b ansible/ci-present.yml \
            -e "ansible_python_interpreter=$(command -v python3)" \
            -e "server_motd_package_src=$wheel"
      - name: Second run is idempotent
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          ansible-playbook -i localhost, -c local -b ansible/ci-present.yml \
            -e "ansible_python_interpreter=$(command -v python3)" \
            -e "server_motd_package_src=$wheel" | tee run2.log
          grep -E "changed=0 .*failed=0" run2.log
      - name: Config is valid and read-only to the service user
        run: |
          sudo stat -c '%U %G %a' /etc/server-motd/config.toml | grep -x 'root server-motd 640'
          sudo -u server-motd /opt/server-motd/venv/bin/server-motd check
      - name: MOTD renders through the hook
        run: |
          sudo /etc/update-motd.d/50-server-motd | tee motd.txt
          grep -q "ci-host" motd.txt
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin run-parts --lsbsysinit /etc/update-motd.d | grep -q "ci-host"
      - name: Hook exits 0 with the venv missing
        run: |
          sudo mv /opt/server-motd/venv /opt/server-motd/venv.off
          sudo /etc/update-motd.d/50-server-motd
          sudo mv /opt/server-motd/venv.off /opt/server-motd/venv
      - name: state absent removes everything
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: |
          ansible-playbook -i localhost, -c local -b ansible/ci-absent.yml \
            -e "ansible_python_interpreter=$(command -v python3)"
          test ! -e /etc/update-motd.d/50-server-motd
          test ! -e /opt/server-motd
          test ! -e /etc/server-motd
          ! getent passwd server-motd

  debian-hook-custom-paths:
    name: role and hook render (non-default paths)
    runs-on: ubuntu-latest
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      ANSIBLE_STDOUT_CALLBACK: default
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build ansible-core
      - run: python -m build --wheel
      - name: Write the non-default role variables
        run: |
          cat > custom-paths.yml <<'EOF'
          server_motd_user: motd-ci
          server_motd_base_dir: /srv/motd-ci
          server_motd_config_dir: /etc/motd-ci
          EOF
      - name: Apply the role with a custom user, base dir and config dir
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          ansible-playbook -i localhost, -c local -b ansible/ci-present.yml \
            -e "ansible_python_interpreter=$(command -v python3)" \
            -e "server_motd_package_src=$wheel" \
            -e @custom-paths.yml
      - name: Nothing landed at the default paths
        run: |
          test ! -e /opt/server-motd
          test ! -e /etc/server-motd
          ! getent passwd server-motd
      - name: Config is valid and read-only to the custom user
        run: |
          sudo stat -c '%U %G %a' /etc/motd-ci/config.toml | grep -x 'root motd-ci 640'
          sudo -u motd-ci /srv/motd-ci/venv/bin/server-motd check --config /etc/motd-ci/config.toml
      - name: MOTD renders through the hook
        run: |
          sudo /etc/update-motd.d/50-server-motd | tee motd.txt
          grep -q "ci-host" motd.txt
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin run-parts --lsbsysinit /etc/update-motd.d | grep -q "ci-host"
      - name: state absent removes the custom paths
        run: |
          ansible-playbook -i localhost, -c local -b ansible/ci-absent.yml \
            -e "ansible_python_interpreter=$(command -v python3)" \
            -e @custom-paths.yml
          test ! -e /etc/update-motd.d/50-server-motd
          test ! -e /srv/motd-ci
          test ! -e /etc/motd-ci
          ! getent passwd motd-ci
