name: Release

# Tag-triggered release: build, publish to PyPI (trusted publishing, no
# tokens), create a GitHub Release, then open a PR refreshing the role lockfile.
# Maintainer prerequisites: docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/server-motd/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  lockfile-pr:
    name: Role lockfile PR
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Assumed location (ticket #29); the job is a no-op until it exists.
      LOCKFILE: ansible/roles/server_motd/files/requirements.lock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Check for role lockfile
        id: check
        run: |
          if [ -f "$LOCKFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$LOCKFILE does not exist yet; skipping lockfile PR"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate lockfile
        if: steps.check.outputs.present == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m pip install pip-tools
          echo "server-motd==${version}" > requirements.in
          # PyPI's index can lag a few minutes behind the upload.
          for attempt in 1 2 3 4 5 6; do
            if pip-compile --quiet --generate-hashes --allow-unsafe \
                --output-file "$LOCKFILE" requirements.in; then
              break
            fi
            [ "$attempt" = 6 ] && exit 1
            sleep 30
          done
          rm requirements.in
      - name: Open pull request
        if: steps.check.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "$LOCKFILE"; then
            echo "Lockfile already current"
            exit 0
          fi
          branch="release/lockfile-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$LOCKFILE"
          git commit -m "Update role lockfile for ${GITHUB_REF_NAME}"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Update role lockfile for ${GITHUB_REF_NAME}" \
            --body "Automated: refreshes the hash-pinned lockfile used by the Ansible role to install server-motd ${GITHUB_REF_NAME#v} from PyPI."
