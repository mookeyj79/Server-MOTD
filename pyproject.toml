[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server-motd"
version = "0.1.0"
description = "Login MOTD showing server identity, system health and service status."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["psutil"]

[project.optional-dependencies]
figlet = ["pyfiglet"]
dev = ["pytest", "ruff", "mypy", "build", "types-psutil"]

[project.scripts]
server-motd = "server_motd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/server_motd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
# Legacy v1 files are out of scope until deleted.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
